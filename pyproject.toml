[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcorona"
version = "0.1.0"
description = "Constraint-Based Hamiltonian Framework for Accretion-Disk Corona Geometry"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Fabio Buffoli", email = "fabio.buffoli@unibs.it"}
]
keywords = [
    "astrophysics",
    "black holes",
    "x-ray",
    "corona",
    "optimization",
    "hamiltonian"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "pyyaml>=6.0",
    "astropy>=5.0",
    "numba>=0.56",      # For JIT compilation of hot loops
    "scikit-learn>=1.0", # For clustering geometry classes
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
    "jupyter",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[project.urls]
"Homepage" = "https://github.com/fabiobuffoli/qcorona"
"Bug Tracker" = "https://github.com/fabiobuffoli/qcorona/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["qcorona*"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
