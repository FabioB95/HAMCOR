    M_bh_err: 0.37e7
    incl: 45.0
    fit_band: [2.0e-4, 7.0e-4]
    model: "TBabs*zxipcf*(relxill + xillver + zgauss)"   # low states: partial covering (Grupe+2012; Gallo+2015)
    D_emiss_sys: 0.005            # |D(broken q) - D(single q)| at a=0.998 (emissivity-model systematic)

