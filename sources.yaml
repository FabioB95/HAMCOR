# HAMCOR v2 — source configuration
# Every value marked VERIFY is printed by the pipeline next to the FITS header value
# (OBJECT, DATE-OBS) or must be confirmed against the cited paper before submission.

defaults:
  dt: 100.0                    # s, light-curve bin (AGN)
  seg_len: 256                 # bins per segment (25.6 ks), non-overlapping
  n_fbins: 12                  # log-spaced lag-frequency bins between f_min and f_max
  f_max: 5.0e-3                # Hz
  soft_band: [0.3, 1.0]        # keV
  hard_band: [1.5, 4.0]        # keV
  lag_energy_bins: [0.3, 0.4, 0.5, 0.6, 0.8, 1.0, 1.3, 1.6, 2.0, 2.5, 3.0, 4.0, 5.0, 6.0, 7.0, 8.0, 10.0]
  src_radius_arcsec: 40.0
  bkg_radius_arcsec: 50.0
  bkg_offset_arcsec: [0.0, -180.0]   # (dRA*cos dec, dDec) from source; CHECK region file
  flare_rate: 0.5              # ct/s, 10-12 keV PATTERN==0 (spectra always GTI-filtered)
  gti_lightcurves: false       # light curves: background-subtracted, no GTI gaps
  spec_range: [0.3, 10.0]      # keV for the reflection fit
  min_counts: 25
  spec_systematic: 0.01        # 1% calibration systematic (pn, >1e6 counts); chi2 also given stat-only
  free_Rbr: true               # relxill emissivity break radius free in [2, 30] r_g
  # Reflection model (XSPEC syntax): relativistic disc (relxill) + distant reflector
  # (xillver, reflection only, logxi=0, Gamma/A_Fe tied); relxill loaded as a local model.
  model: "TBabs*(relxill + xillver)"
  pexrav_model: "TBabs*(pexrav + zgauss)"     # 3-10 keV cross-check
  # Spectral fits use the spacetime of the HAMCOR forward model (Schwarzschild, a = 0,
  # Rin = ISCO = 6 r_g = inner edge of the HAMCOR disc grid), so that I_obs = R_f/(1+R_f)
  # is the same observable as the model illumination fraction.
  spin: 0.0
  spin_systematic_alt: 0.998   # refit at this spin; differences in I and D added as systematics
  continuum_lag: true          # profiled continuum hard lag A (nu/nu0)^-a in the lag fit
  grid: {r_in: 3.0, r_out: 30.0, z_min: 0.1, z_max: 20.0, n_r: 10, n_z: 10, n_phi: 8}   # log-spaced
  disc: {r_in: 6.0, r_out: 100.0, n_r: 30, n_phi: 18}

sources:

  mrk335_2006:
    name: "Mrk 335"
    obsid: "0306870101"        # 2006 Jan 03, high flux
    ra: 1.581342               # deg, NED  VERIFY
    dec: 20.202914
    z: 0.025785
    nH_gal: 0.0356             # 1e22 cm^-2 (HI4PI)  VERIFY
    M_bh: 1.3e7                # Chainakun & Young 2015 (log M = 7.1); Grier+2012: 1.42e7
    M_bh_err: 0.37e7
    incl: 45.0                 # Chainakun & Young 2015
    fit_band: [2.0e-4, 7.0e-4] # Hz, reverberation band (Kara+2013)
    model: "TBabs*(relxill + xillver + zgauss)"
    D_emiss_sys: 0.06            # |D(broken q) - D(single q)| at a=0.998 (emissivity-model systematic)

  mrk335_2009:
